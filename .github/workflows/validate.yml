name: Validate and sync GameMaker project

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Validate committed GameMaker project
        run: python validate_gamemaker.py
      - name: Verify source-to-GameMaker synchronization
        run: python tools/sync_gamemaker.py --check
