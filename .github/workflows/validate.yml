name: Validate project

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Node 24 majors: Node 20 was retired from Actions runners on 2026-09-23, and
      # checkout@v4 / setup-python@v5 only worked by being force-run on Node 24.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Validate gamemaker/ against game/
        run: python3 validate_gamemaker.py

      - name: Verify source-to-GameMaker synchronization
        run: python3 tools/sync_gamemaker.py --check

      - name: Check Python tool syntax
        run: python3 -m py_compile gen_gamemaker.py validate_gamemaker.py tools/*.py

      # Item/equipment schema, progression tiers and merchant coverage. This was a manual
      # check before; wiring it here catches data regressions that the structural validator
      # does not read.
      - name: Audit equipment and item progression
        run: python3 tools/equipment_check.py

      # Catches the wiring validate_gamemaker.py cannot see: scripted lines with no dialogue
      # node, marker hooks with no dispatcher, zone exits naming a spawn the target room does
      # not define, undefined encounter tables/enemies, quest stages, and rooms with no ambience.
      - name: Audit chapter wiring
        run: python3 tools/audit_chapters.py
